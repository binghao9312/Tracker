classification:
  pressure: 2.0
  cvd: 0.0
  oi_change: 0.05
  allow_missing_cvd: false
trade_signal:
  pressure: 2.0
  pressure_dominance_ratio: 1.5
  delta_ratio: 0.15
funding:
  elevated_positive: 0.001
  elevated_negative: -0.001
paper_trading:
  enabled: true
  entry_activity_score: 80
  rearm_activity_score: 65
  signal_persistence_seconds: 5
  cooldown_minutes: 15
  notional_usdt: 1000
  max_open_positions: 5
  take_profit_pct: 0.02
  stop_loss_pct: 0.01
  max_holding_minutes: 60
  fee_bps: 5
  require_cross_exchange_confirmation: false

activity:
  spot_pressure_saturation: 1.0
  perp_pressure_saturation: 3.0
  oi_change_saturation: 0.02
  funding_saturation: 0.0005

data_retention:
  # Phase C1 needs 3-4 weeks of usable data in the database at once. At 30 days a
  # 28-day analysis window had two days of margin, and the pruner runs hourly, so a
  # late run would silently lose the start of its own window. 45 days costs about
  # 58 GB more (growth is ~4.3 GB/day, disk has 924 GB free) and buys 17 days of slack.
  metric_history_days: 45
