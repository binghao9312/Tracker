services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: qtrade
      POSTGRES_USER: qtrade
      POSTGRES_PASSWORD: qtrade
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qtrade -d qtrade"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    # Published on loopback only, so `python -m research` can reach the metrics from
    # the host. The backend still connects over the compose network on 5432; this is a
    # second door for read-only analysis, not the application's path. Binding to
    # 127.0.0.1 rather than 0.0.0.0 keeps it off the local network.
    ports: ["127.0.0.1:5433:5432"]
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://qtrade:qtrade@postgres:5432/qtrade
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["8001:8000"]
  frontend:
    image: node:24-alpine
    working_dir: /app
    environment:
      VITE_API_PROXY: http://backend:8000
      VITE_WS_PROXY: ws://backend:8000
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on: [backend]
    ports: ["5174:5173"]
volumes:
  postgres-data:
  frontend-node-modules:
